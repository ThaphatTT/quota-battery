<script>
(function(){
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const tl = gsap.timeline({paused:true});

const st={v:5};
const stops=[[0,'#FF5F57'],[0.05,'#FF5F57'],[0.2,'#FFD60A'],[1,'#30D158']];
function colorAt(f){for(let i=1;i<stops.length;i++){if(f<=stops[i][0]){const a=stops[i-1],b=stops[i];const k=(f-a[0])/(b[0]-a[0]||1);return gsap.utils.interpolate(a[1],b[1],k);}}return stops[stops.length-1][1];}
function paint(){const f=st.v/100;const W=Math.round(f*(580-40-24));const F=document.getElementById('s7-fill');
  F.style.width=Math.max(50,W)+'px';const c=colorAt(f);F.style.background=c;F.style.boxShadow='0 0 '+(20+60*f)+'px '+c;
  const P=document.getElementById('s7-pct');P.textContent=Math.round(st.v)+'%';P.style.color=c;}
paint();
tl.fromTo('#s7-en',{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:0.3,ease:'expo.out'},0.1);

// charge to full
tl.to(st,{v:100,duration:3.0,ease:'power2.inOut',onUpdate:paint},1.2);
tl.fromTo('#s7-glow',{opacity:0},{opacity:1,duration:3.0,ease:'power2.in'},1.2);
// full: flash + battery outline turns green
tl.to('#s7-batt',{borderColor:'#30D158',duration:0.3,ease:'power2.out'},4.2);
tl.to('#s7-nub',{backgroundColor:'#30D158',duration:0.3,ease:'power2.out'},4.2);
tl.fromTo('#s7-flash',{opacity:0.4},{opacity:0,duration:0.6,ease:'power2.out'},4.2);
tl.fromTo('#s7-bw',{scale:1},{scale:1.06,duration:0.12,ease:'power2.out',yoyo:true,repeat:1,transformOrigin:'540px 725px'},4.2);
// lockup
tl.fromTo('#s7-lock',{opacity:0,y:50,filter:'blur(10px)',scale:0.94},{opacity:1,y:0,filter:'blur(0px)',scale:1,duration:0.7,ease:'expo.out'},4.5);

tl.fromTo('#s7-win',{opacity:0,y:40,filter:'blur(8px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.55,ease:'expo.out'},6.6);
tl.fromTo('#s7-wth',{opacity:0,y:20,filter:'blur(6px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.45,ease:'expo.out'},6.9);
// ends alive: soft glow breath + second sweep on the link, then fade to black over the last 0.5 s

window.__timelines["s7"] = tl;
})();

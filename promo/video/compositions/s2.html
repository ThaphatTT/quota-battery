<template>
<style>

@font-face{font-family:'QBThai';font-weight:700;src:local('SukhumvitSet-Bold'),local('Sukhumvit Set Bold'),local('Thonburi Bold'),local('Thonburi');}

  --red:#FF5F57;--yellow:#FFD60A;--green:#30D158;--ink:#F5F5F7;--mute:#98989D;--card:#1C1C1E;}

</style>
<div id="root" data-composition-id="s2" data-width="1080" data-height="1920">

<div id="s2-bg"></div>
<div class="cap" id="s2-cap"><div class="en" id="s2-en">Too many tabs to check limits</div><div class="th" id="s2-th">เปิดหลายแท็บเพื่อเช็คลิมิต</div></div>
<div id="s2-stage"><div class="s2-tab" data-layout-allow-overlap id="s2-t0"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-C">C</div><div class="ttl">Claude: Usage</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t1"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-G">G</div><div class="ttl">ChatGPT: Usage limits</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t2"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-A">A</div><div class="ttl">agy: Quota</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t3"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-C">C</div><div class="ttl">Claude: Settings</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t4"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-G">G</div><div class="ttl">Codex: Usage</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t5"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-A">A</div><div class="ttl">agy: Models</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t6"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-C">C</div><div class="ttl">Claude: Plan</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t7"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-G">G</div><div class="ttl">ChatGPT: Billing</div><div class="sk2"></div></div>
<div class="s2-tab" data-layout-allow-overlap id="s2-t8"><div class="bar"><b></b><b></b><b></b></div><div class="letter L-C">C</div><div class="ttl">Claude: Limits</div><div class="sk2"></div></div></div>
<div id="s2-flash" class="abs" style="inset:0;background:#fff;opacity:0"></div>

</div>
<script>
(function(){
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const tl = gsap.timeline({paused:true});

const r = rng(29);
const N=9, topBase=480, step=122;
const stage=document.getElementById('s2-stage');
const rot=[-1.2,1,-0.8,1.2,-1.2,0.8,-1,1.2,-0.4];
const xs=[-24,18,-8,26,-18,12,-28,20,0];
for(let i=0;i<N;i++){
  const el=document.getElementById('s2-t'+i);
  el.style.top=(topBase+i*step)+'px';
  el.style.zIndex=10+i;
  // staggered arrival from below with slight overshoot
  const t=0.8+i*0.36;
  tl.fromTo(el,{opacity:0,y:160,x:xs[i]*3,rotation:rot[i]*3,scale:0.9},{opacity:1,y:0,x:xs[i],rotation:rot[i],scale:1,duration:0.5,ease:'back.out(1.2)'},t);
}
// text
tl.fromTo('#s2-en',{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:0.3,ease:'expo.out'},0.1);
tl.fromTo('#s2-th',{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:0.3,ease:'expo.out'},0.35);
// tension shake from 4.5 s
for(let s=0;s<22;s++){
  const t=4.5+s*0.04; const amp=1+s*0.35;
  tl.set('#s2-stage',{x:(r()-0.5)*amp*3,y:(r()-0.5)*amp*2},t);
}
tl.set('#s2-stage',{x:0,y:0},5.4);
// shatter at 5.4 s: shards from clones
const cols=4,rows=3;
for(let i=0;i<N;i++){
  const el=document.getElementById('s2-t'+i);
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;left:100px;top:'+el.style.top+';width:880px;height:144px;z-index:'+(40+i)+';opacity:0;transform:translate('+xs[i]+'px,0) rotate('+rot[i]+'deg)';
  wrap.id='s2-sw'+i; stage.appendChild(wrap);
  let k=0;
  for(let c=0;c<cols;c++)for(let rr=0;rr<rows;rr++){
    // each cell split into two triangles
    for(let h=0;h<2;h++){
      const x0=c/cols*100,x1=(c+1)/cols*100,y0=rr/rows*100,y1=(rr+1)/rows*100;
      const poly=h? `${x0}% ${y0}%,${x1}% ${y0}%,${x1}% ${y1}%` : `${x0}% ${y0}%,${x1}% ${y1}%,${x0}% ${y1}%`;
      const clone=el.cloneNode(true); clone.removeAttribute('id'); clone.style.cssText='position:absolute;left:0;top:0;border-radius:26px;';
      clone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
      const sh=document.createElement('div'); sh.className='s2-shard'; sh.style.clipPath='polygon('+poly+')'; sh.appendChild(clone); wrap.appendChild(sh);
      const cx=((x0+x1)/2-50)/50, cy=((y0+y1)/2-50)/50;
      const vx=cx*520+(r()-0.5)*260, vy=cy*160+ (r()-0.2)*900, rotz=(r()-0.5)*620;
      tl.set(sh,{opacity:1},0);
      tl.to(sh,{x:vx,y:vy,rotation:rotz,opacity:0,duration:1.1,ease:'power2.out'},5.4+i*0.025);
    }
  }
  tl.set('#s2-t'+i,{opacity:0},5.4+i*0.025);
  tl.set(wrap,{opacity:1},5.4+i*0.025);
}
tl.set('#s2-flash',{opacity:0.5},5.4);
tl.to('#s2-flash',{opacity:0,duration:0.35,ease:'power2.out'},5.45);
// out
tl.to('#root',{opacity:0,duration:0.25,ease:'power2.in'},7.72);

window.__timelines["s2"] = tl;
})();
</script>

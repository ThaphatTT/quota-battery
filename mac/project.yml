name: AIUsage
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
# The Team id lives in mac/Local.xcconfig (not committed), included by Config/Base.xcconfig.
# It is not set here: a value in settings.base would override the xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  AIUsage:
    type: application
    platform: macOS
    sources:
      - path: AIUsage
      - path: Shared
        excludes:
          - Sample/**
    dependencies:
      - target: AIUsageWidget
        embed: true
    info:
      path: AIUsage/Info.plist
      properties:
        CFBundleDisplayName: Quota Battery
        CFBundleName: Quota Battery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # The first "+ Add account" asks the user to let AIUsage control Terminal, which opens the login there.
        NSAppleEventsUsageDescription: "Quota Battery opens Terminal so that you can sign in to another account. (เปิด Terminal เพื่อล็อกอินบัญชีอื่น)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aiusage.AIUsage
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AIUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: AIUsageWidget
      - path: Shared
        excludes:
          - Sample/**
      - path: Shared/Sample/usage.sample.json
        buildPhase: resources
    info:
      path: AIUsageWidget/Info.plist
      properties:
        CFBundleDisplayName: Quota Battery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AIUsageWidget/AIUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - "/Library/Application Support/AIUsage/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aiusage.AIUsage.AIUsageWidget
        GENERATE_INFOPLIST_FILE: NO
  AIUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
        excludes:
          - Sample/**
      - path: AIUsage/RefreshCommand.swift
      # The popover and the window's cards, by name, so the snapshot tests can draw them. These files need only the
      # shared language table and the view-free insights. The scenes, the model and the status item stay out.
      - path: AIUsage/AppUsageInsights.swift
      - path: AIUsage/LocalPalette.swift
      - path: AIUsage/LocalMotion.swift
      - path: AIUsage/FirstOpenMotion.swift
      - path: AIUsage/MotionViews.swift
      - path: AIUsage/LocalBrandIcon.swift
      - path: AIUsage/LocalBatteryGauge.swift
      - path: AIUsage/LocalUsageBar.swift
      - path: AIUsage/AppAccountCard.swift
      - path: AIUsage/MenuBarPopoverView.swift
      - path: AIUsage/AppAccountsSection.swift
      - path: AIUsage/AppDirectModeConsent.swift
      - path: AIUsage/AppModelMixSection.swift
      # The Settings window's panes and the open-at-login model (the system login item is not in the tests: they use a fake).
      - path: AIUsage/AppSettingsWindow.swift
      - path: AIUsage/OpenAtLogin.swift
      # The window content and the model, so the performance and publish-count tests can drive them.
      - path: AIUsage/ContentView.swift
      - path: AIUsage/AppSettings.swift
      - path: AIUsage/UsageViewModel.swift
      - path: AIUsage/MenuBarStatusItem.swift
      - path: AIUsage/TerminalLauncher.swift
      - path: AIUsage/LocalUsageRing.swift
      - path: AIUsage/ClaudeHeaderQuota.swift
      - path: AIUsage/CodexSidebarQuota.swift
      - path: AIUsage/QuotaOverlayContent.swift
      - path: AIUsage/QuotaOverlayTracker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aiusage.AIUsageTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIUsage:
    build:
      targets:
        AIUsage: all
        AIUsageWidget: all
        AIUsageTests: [test]
    test:
      config: Debug
      targets:
        - AIUsageTests
